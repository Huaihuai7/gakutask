<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク｜学タスク</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>学タスク</h1>
  <p>学び・仕事を積み重ねよう</p>
 
  <div class="form">
    <input id="taskInput" placeholder="やること">
    <button id="addBtn">追加</button>
  </div>
 
  <div class="options">
    <select id="categoryInput" aria-label="カテゴリ"></select>
    <select id="catInput">
      <option>Java</option>
      <option>HTML・CSS</option>
      <option>PHP</option>
      <option>SQL</option>
      <option>その他</option>
    </select>
    <input type="date" id="dueInput">
    <select id="priorityInput">
    <option value="高">優先度：高</option>
    <option value="中" selected>優先度：中</option>
    <option value="低">優先度：低</option>
    </select>
    <select id="repeatInput" aria-label="繰り返し">
    <option value="">繰り返し：なし</option>
    <option value="daily">繰り返し：毎日</option>
    <option value="weekly">繰り返し：毎週</option>
    <option value="monthly">繰り返し：毎月</option>
    </select>
    </div>
    

   <!-- ▼ 検索と絞り込み -->
  <div class="filter">
    <input id="searchInput" type="search" placeholder="タスクを検索" aria-label="タスクを検索">
    <select id="filterCategory" aria-label="カテゴリで絞り込む"></select>
    <button id="clearFilter" class="btn-sub">クリア</button>
  </div>
  <p id="resultInfo" class="set-note"></p>
  
  <ul id="taskList"></ul>
 
  <div id="undoBar" class="undo" hidden>
    <span>タスクを削除しました</span>
    <button id="undoBtn">元に戻す</button>
    <button id="undoClose" class="undo-close" aria-label="閉じる">×</button>
  </div>
