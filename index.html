<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学タスク</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>学タスク</h1>
  <p>学び・仕事を積み重ねよう</p>
 
  <div class="summary">
    <div><small>総タスク</small><b id="sumTotal">0</b></div>
    <div><small>完了</small><b id="sumDone">0</b></div>
    <div><small>進捗率</small><b id="sumRate">0%</b></div>
    <div><small>今週の学習時間</small><b id="sumTime">0時間0分</b></div>
  </div>

  <h2>今日のタスク</h2>
  <ul id="todayList"></ul>

  <h2>最新のメモ</h2>
  <ul id="latestMemo"></ul>

  <h2>今後の予定</h2>
  <ul id="upcomingList"></ul>
  
  <h2>学習時間を記録</h2>
  <div class="options">
    <select id="logCat">
      <option>Java</option>
      <option>HTML・CSS</option>
      <option>PHP</option>
      <option>SQL</option>
      <option>その他</option>
    </select>
    <input id="logMin" type="number" min="1" placeholder="分">
    <button id="logBtn">記録</button>
  </div>
  <p id="logMsg" class="set-msg" role="status"></p>


  <h2>科目別の達成度</h2>
  <div id="catBars"></div>
