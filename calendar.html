<h1>学タスク</h1>
<p>学び・仕事を積み重ねよう</p>
 
<!-- ▼ カレンダー本体 -->
<div class="cal-card">
<div class="cal-head">
<button id="prevBtn" aria-label="前の月">‹</button>
<b id="calTitle"></b>
<button id="nextBtn" aria-label="次の月">›</button>
</div>
 
<div class="cal-week">
<span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
</div>
<div id="calGrid" class="cal-grid"></div>
 
<button id="todayBtn" class="today-btn">今日に戻る</button>
</div>
 
<!-- ▼ 選んだ日のタスク -->
<h2 id="dayTitle"></h2>
<ul id="dayList"></ul>
