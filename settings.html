<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設定｜学タスク</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>学タスク</h1>
  <p>学び・仕事を積み重ねよう</p>
 
  <!-- ▼ 名前 -->
  <div class="set-card">
    <h2>名前</h2>
    <div class="set-row">
      <input id="nameInput" placeholder="ニックネーム">
      <button id="nameSaveBtn">保存</button>
    </div>
  </div>
 
  <!-- ▼ バックアップ -->
  <div class="set-card">
    <h2>バックアップ</h2>
    <p class="set-note">タスクとメモを、ファイルに書き出せます。別のパソコンに移すときにも使えます。</p>
    <div class="set-row">
      <button id="exportBtn" class="btn-sub">書き出す</button>
      <label class="btn-sub file-btn">
        読み込む
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </label>
    </div>
  </div>
   <!-- ▼ カレンダーに登録（通知付き） -->
  <div class="set-card">
    <h2>カレンダーに登録</h2>
    <p class="set-note">期限のある未完了のタスクを、カレンダーのファイル（.ics）に書き出します。スマホのカレンダーに読み込むと、前日の9時と当日の9時に、通知が来ます。</p>
    <button id="icsBtn" class="btn-sub">カレンダーのファイルを書き出す</button>
  </div>
 
  <!-- ▼ データの削除 -->
  <div class="set-card">
    <h2>データの削除</h2>
    <p class="set-note">削除すると、元に戻せません。先にバックアップをおすすめします。</p>
    <div class="set-row wrap">
      <button id="clearTasksBtn" class="btn-danger">タスクを全部削除</button>
      <button id="clearMemosBtn" class="btn-danger">メモを全部削除</button>
      <button id="clearAllBtn" class="btn-danger">すべて削除</button>
    </div>
  </div>
 
  <p id="msg" class="set-msg" role="status"></p>
